<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Find Spots – Roll 'n Connect</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #05050a;
      color: #fff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* LOCATION OVERLAY */
    #locOverlay {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px;
      transition: opacity 0.4s;
    }
    #locOverlay.fade-out { opacity: 0; pointer-events: none; }
    .loc-emoji { font-size: 3rem; }
    .loc-title { font-size: 1.5rem; font-weight: 700; text-align: center; }
    .loc-sub {
      font-size: 0.88rem;
      opacity: 0.55;
      text-align: center;
      max-width: 320px;
      line-height: 1.5;
    }
    .loc-btn {
      padding: 12px 30px;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
    }
    .skip-btn {
      background: none;
      border: none;
      color: rgba(255,255,255,0.35);
      font-size: 0.78rem;
      cursor: pointer;
      text-decoration: underline;
    }

    /* HEADER */
    header {
      padding: 12px 16px;
      background: #0a0a14;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    header .brand { font-weight: 700; font-size: 1rem; }
    header .loc-tag {
      font-size: 0.72rem;
      opacity: 0.45;
      margin-top: 2px;
    }
    header nav a {
      color: #9ca3af;
      text-decoration: none;
      margin-left: 12px;
      font-size: 0.82rem;
    }

    /* MAP */
    #map {
      width: 100%;
      height: 340px;
      flex-shrink: 0;
    }

    /* FILTER BAR */
    .filters {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 9px 10px;
      background: #0d0d1a;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      scrollbar-width: none;
    }
    .filters::-webkit-scrollbar { display: none; }

    .filter-btn {
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.04);
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
      font-size: 0.78rem;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
      transition: all 0.18s;
    }
    .filter-btn.active {
      background: #fff;
      color: #000;
      border-color: #fff;
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .dot.skatepark { background: #38bdf8; }
    .dot.rink      { background: #a855f7; }
    .dot.trail     { background: #22c55e; }
    .dot.water     { background: #0ea5e9; }
    .dot.food      { background: #f97316; }
    .dot.parking   { background: #e5e7eb; }
    .dot.restroom  { background: #4ade80; }

    /* CONTENT */
    .content { padding: 14px 14px 20px; flex: 1; }

    .live-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .icon-btn {
      flex: 1;
      padding: 9px;
      border: none;
      border-radius: 8px;
      background: rgba(255,255,255,0.07);
      color: #fff;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .icon-btn.live-on { background: rgba(239,68,68,0.25); color: #ef4444; }

    /* SPOT CARDS */
    .spot-card {
      background: #0d1117;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .spot-card:hover { border-color: rgba(255,255,255,0.2); }
    .spot-card-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .spot-card-title { font-weight: 600; font-size: 0.92rem; }
    .spot-card-star { font-size: 0.8rem; opacity: 0.75; white-space: nowrap; margin-left: 8px; }
    .spot-card-meta { font-size: 0.76rem; opacity: 0.55; margin-top: 3px; }
    .spot-card-tag {
      display: inline-block;
      margin-top: 5px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 600;
      background: rgba(255,255,255,0.08);
    }

    .load-more {
      padding: 10px;
      text-align: center;
      cursor: pointer;
      background: rgba(255,255,255,0.06);
      border-radius: 8px;
      margin-top: 8px;
      font-size: 0.82rem;
    }

    /* DETAIL PANEL */
    .details {
      margin-top: 16px;
      padding: 16px;
      background: #0d1117;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      display: none;
    }
    .details-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }
    .close-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      color: #fff;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 14px;
      flex-shrink: 0;
    }
    .rating-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      font-size: 0.82rem;
    }
    .section-title {
      font-size: 0.85rem;
      font-weight: 700;
      margin: 14px 0 8px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.07);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      opacity: 0.7;
    }
    .review-form input,
    .review-form textarea,
    .review-form select {
      width: 100%;
      margin-bottom: 7px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      color: #fff;
      font-size: 0.82rem;
    }
    .review-form select option { background: #111; }
    .primary-btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #fff;
      color: #000;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
      font-size: 0.85rem;
    }
    .dir-btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #4a4aff;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.85rem;
      box-shadow: 0 0 12px rgba(74,74,255,0.35);
      margin-bottom: 4px;
    }
    .review-item {
      background: rgba(255,255,255,0.04);
      padding: 8px 10px;
      border-radius: 8px;
      margin-bottom: 6px;
      font-size: 0.8rem;
    }
    .review-meta { font-weight: 600; margin-bottom: 2px; }
    .review-stars { opacity: 0.55; font-size: 0.72rem; margin-top: 2px; }
  </style>
</head>

<body>

<!-- LOCATION PERMISSION OVERLAY (shown first, before map loads) -->
<div id="locOverlay">
  <div class="loc-emoji">📍</div>
  <div class="loc-title">Find Spots Near You</div>
  <div class="loc-sub">Share your location to discover nearby skateparks, paved trails, rinks, water spots, and more.</div>
  <button class="loc-btn" id="grantLocBtn">📍 Use My Location</button>
  <button class="skip-btn" id="skipLocBtn">Skip – browse default area</button>
</div>

<!-- HEADER -->
<header>
  <div>
    <div class="brand">🛹 Find Spots</div>
    <div class="loc-tag" id="locTag">Locating…</div>
  </div>
  <nav>
    <a href="events.html">Events</a>
    <a href="calendar.html">Calendar</a>
    <a href="profile.html">Profile</a>
  </nav>
</header>

<!-- MAP -->
<div id="map"></div>

<!-- FILTER BAR -->
<div class="filters">
  <button class="filter-btn active" data-key="skatepark"><div class="dot skatepark"></div>Skateparks</button>
  <button class="filter-btn" data-key="roller_rink"><div class="dot rink"></div>Rinks</button>
  <button class="filter-btn" data-key="trail"><div class="dot trail"></div>Paved Trails</button>
  <button class="filter-btn" data-key="water"><div class="dot water"></div>Water Spots</button>
  <button class="filter-btn" data-key="food"><div class="dot food"></div>Food</button>
  <button class="filter-btn" data-key="parking"><div class="dot parking"></div>Parking</button>
  <button class="filter-btn" data-key="restroom"><div class="dot restroom"></div>Restrooms</button>
</div>

<!-- CONTENT -->
<div class="content">
  <div class="live-row">
    <button class="icon-btn" id="locateBtn">📍 Re-center</button>
    <button class="icon-btn" id="liveBtn">🔴 Live Track</button>
  </div>

  <div id="spotList"></div>
  <div id="loadMore" class="load-more" style="display:none;">Load more</div>

  <div id="details" class="details">
    <div class="details-header">
      <h2 id="dName" style="font-size:1.1rem;"></h2>
      <button class="close-btn" id="closeDetails">✕</button>
    </div>
    <div id="dAddress" style="opacity:0.55;font-size:0.8rem;margin-bottom:5px;"></div>
    <div id="dRating" style="font-size:0.85rem;margin-bottom:10px;"></div>

    <button id="directionsBtn" class="dir-btn">Get Directions →</button>

    <div class="section-title">Community Ratings</div>
    <div class="rating-row"><span>Smoothness</span><span id="avgSmooth">–</span></div>
    <div class="rating-row"><span>Difficulty</span><span id="avgDifficulty">–</span></div>

    <div class="section-title">Leave a Review</div>
    <div class="review-form">
      <input id="rName" placeholder="Your name" />
      <textarea id="rText" rows="2" placeholder="Describe the spot – surface, vibe, tips…"></textarea>
      <select id="rSmooth">
        <option value="">Smoothness –</option>
        <option value="1">1 – Rough</option>
        <option value="2">2</option>
        <option value="3">3 – OK</option>
        <option value="4">4</option>
        <option value="5">5 – Glass smooth</option>
      </select>
      <select id="rDifficulty">
        <option value="">Difficulty –</option>
        <option value="1">1 – Beginner</option>
        <option value="2">2</option>
        <option value="3">3 – Intermediate</option>
        <option value="4">4</option>
        <option value="5">5 – Expert</option>
      </select>
      <button id="submitReview" class="primary-btn">Post Review</button>
    </div>

    <div class="section-title">Reviews</div>
    <div id="reviewList"></div>
  </div>
</div>

<script>
  // ── State ──────────────────────────────────────────────────────────
  let map, placesService;
  let allSpots = [];
  let markers = [];
  let activeFilters = new Set(["skatepark"]);
  let pageIndex = 0;
  const PAGE_SIZE = 6;

  let userLoc = null;
  let userMarker = null;
  let liveWatch = null;
  let activeSpot = null;
  let openInfoWindow = null;

  const DEFAULT_LOC = { lat: 33.8, lng: -84.3 };

  // ── Filter config ──────────────────────────────────────────────────
  const FILTER_CFG = {
    skatepark:   { keyword: "skatepark",                       color: "#38bdf8", label: "Skatepark" },
    roller_rink: { keyword: "roller rink",                     color: "#a855f7", label: "Rink" },
    trail:       { keyword: "paved trail bike trail",          color: "#22c55e", label: "Trail" },
    water:       { keyword: "water fountain hydration",        color: "#0ea5e9", label: "Water" },
    food:        { keyword: "food restaurant",                 color: "#f97316", label: "Food", type: "restaurant" },
    parking:     { keyword: "parking",                         color: "#e5e7eb", label: "Parking", type: "parking" },
    restroom:    { keyword: "restroom public bathroom",        color: "#4ade80", label: "Restroom" },
  };

  // ── Location overlay ───────────────────────────────────────────────
  document.getElementById("grantLocBtn").onclick = function() {
    if (!navigator.geolocation) { startApp(DEFAULT_LOC); return; }
    navigator.geolocation.getCurrentPosition(
      function(pos) {
        userLoc = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        document.getElementById("locTag").textContent = "Near you";
        startApp(userLoc);
      },
      function() { startApp(DEFAULT_LOC); }
    );
  };

  document.getElementById("skipLocBtn").onclick = function() {
    startApp(DEFAULT_LOC);
  };

  function hideOverlay() {
    var el = document.getElementById("locOverlay");
    el.classList.add("fade-out");
    setTimeout(function() { el.style.display = "none"; }, 420);
  }

  // ── Load Google Maps dynamically via /api/config ───────────────────
  function loadMapsScript(apiKey) {
    return new Promise(function(resolve) {
      window._mapsLoaded = resolve;
      var s = document.createElement("script");
      s.src = "https://maps.googleapis.com/maps/api/js?key=" + apiKey + "&libraries=places&callback=_mapsLoaded";
      s.async = true;
      s.defer = true;
      document.head.appendChild(s);
    });
  }

  function startApp(center) {
    hideOverlay();
    if (!map) {
      initMap(center);
    } else {
      map.panTo(center);
      if (userLoc) placeUserMarker(userLoc);
    }
  }

  function initMap(center) {
    map = new google.maps.Map(document.getElementById("map"), {
      center: center,
      zoom: 14,
      styles: [
        { elementType: "geometry", stylers: [{ color: "#0f0f1a" }] },
        { elementType: "labels.text.stroke", stylers: [{ color: "#0f0f1a" }] },
        { elementType: "labels.text.fill",   stylers: [{ color: "#9090b0" }] },
        { featureType: "road", elementType: "geometry", stylers: [{ color: "#1a1a2e" }] },
        { featureType: "road.highway", elementType: "geometry", stylers: [{ color: "#1e1e3a" }] },
        { featureType: "water", elementType: "geometry", stylers: [{ color: "#050a20" }] },
        { featureType: "poi",   elementType: "geometry", stylers: [{ color: "#131320" }] },
        { featureType: "transit", elementType: "geometry", stylers: [{ color: "#0f0f1f" }] },
        { featureType: "administrative", elementType: "geometry", stylers: [{ color: "#1a1a35" }] },
      ],
      disableDefaultUI: true,
      zoomControl: true,
    });

    placesService = new google.maps.places.PlacesService(map);
    if (userLoc) placeUserMarker(userLoc);
    setupFilters();
    setupButtons();
    runSearch();
  }

  // ── Filter chips ───────────────────────────────────────────────────
  function setupFilters() {
    document.querySelectorAll(".filter-btn").forEach(function(btn) {
      btn.onclick = function() {
        var k = btn.dataset.key;
        if (btn.classList.contains("active")) {
          btn.classList.remove("active");
          activeFilters.delete(k);
        } else {
          btn.classList.add("active");
          activeFilters.add(k);
        }
        runSearch();
      };
    });
  }

  // ── Control buttons ────────────────────────────────────────────────
  function setupButtons() {
    document.getElementById("locateBtn").onclick = function() {
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(function(pos) {
        userLoc = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        map.panTo(userLoc);
        map.setZoom(15);
        placeUserMarker(userLoc);
        runSearch();
      });
    };

    document.getElementById("liveBtn").onclick = function() {
      if (liveWatch) {
        navigator.geolocation.clearWatch(liveWatch);
        liveWatch = null;
        this.classList.remove("live-on");
        this.textContent = "🔴 Live Track";
        return;
      }
      if (!navigator.geolocation) return;
      this.classList.add("live-on");
      this.textContent = "⏹ Stop Live";
      var self = this;
      liveWatch = navigator.geolocation.watchPosition(function(pos) {
        userLoc = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        placeUserMarker(userLoc);
      });
    };

    document.getElementById("loadMore").onclick = function() {
      pageIndex++;
      renderPage();
    };

    document.getElementById("closeDetails").onclick = function() {
      document.getElementById("details").style.display = "none";
    };

    document.getElementById("submitReview").onclick = function() {
      if (!activeSpot) return;
      var name   = document.getElementById("rName").value.trim() || "Anonymous";
      var text   = document.getElementById("rText").value.trim();
      var smooth = document.getElementById("rSmooth").value;
      var diff   = document.getElementById("rDifficulty").value;
      var id = activeSpot.place_id;
      var reviews = loadReviews(id);
      reviews.unshift({ name: name, text: text, smoothness: Number(smooth) || null, difficulty: Number(diff) || null }); // newest first
      saveReviews(id, reviews);
      document.getElementById("rName").value = "";
      document.getElementById("rText").value = "";
      document.getElementById("rSmooth").value = "";
      document.getElementById("rDifficulty").value = "";
      renderReviews(id);
    };
  }

  // ── Nearby search ──────────────────────────────────────────────────
  function runSearch() {
    if (!placesService) return;
    clearMarkers();
    allSpots = [];
    var searchCenter = userLoc || (map ? map.getCenter() : DEFAULT_LOC);
    var filters = activeFilters.size > 0 ? Array.from(activeFilters) : ["skatepark"];
    var pending = filters.length;

    filters.forEach(function(key) {
      var cfg = FILTER_CFG[key] || { keyword: key, color: "#fff" };
      var req = { location: searchCenter, radius: 10000, keyword: cfg.keyword };
      if (cfg.type) req.type = cfg.type;

      placesService.nearbySearch(req, function(results, status) {
        if (status === google.maps.places.PlacesServiceStatus.OK && results) {
          results.forEach(function(r) { r._filterKey = key; });
          allSpots = allSpots.concat(results);
        }
        pending--;
        if (pending === 0) {
          var seen = new Set();
          allSpots = allSpots.filter(function(s) {
            if (seen.has(s.place_id)) return false;
            seen.add(s.place_id);
            return true;
          });
          pageIndex = 0;
          renderPage();
          renderMarkers();
        }
      });
    });
  }

  // ── Spot list ──────────────────────────────────────────────────────
  function renderPage() {
    var list = document.getElementById("spotList");
    list.innerHTML = "";
    var slice = allSpots.slice(0, (pageIndex + 1) * PAGE_SIZE);
    slice.forEach(function(spot) {
      var cfg = FILTER_CFG[spot._filterKey] || { color: "#fff", label: "" };
      var stars = spot.rating ? ("⭐ " + spot.rating.toFixed(1)) : "";
      var div = document.createElement("div");
      div.className = "spot-card";
      div.innerHTML =
        '<div class="spot-card-top">' +
          '<div class="spot-card-title">' + spot.name + '</div>' +
          '<div class="spot-card-star">' + stars + '</div>' +
        '</div>' +
        '<div class="spot-card-meta">' + (spot.vicinity || "") + '</div>' +
        '<span class="spot-card-tag" style="color:' + cfg.color + ';">' + cfg.label + '</span>';
      div.onclick = function() { openDetails(spot); };
      list.appendChild(div);
    });
    document.getElementById("loadMore").style.display =
      allSpots.length > slice.length ? "block" : "none";
  }

  // ── Map markers ────────────────────────────────────────────────────
  function clearMarkers() {
    markers.forEach(function(m) { m.setMap(null); });
    markers = [];
    if (openInfoWindow) { openInfoWindow.close(); openInfoWindow = null; }
  }

  function renderMarkers() {
    clearMarkers();
    allSpots.forEach(function(spot) {
      var cfg = FILTER_CFG[spot._filterKey] || { color: "#fff" };
      var loc = spot.geometry.location;
      var reviews = loadReviews(spot.place_id);
      var avg = function(key) {
        var vals = reviews.map(function(r) { return r[key]; }).filter(function(v) { return v; });
        return vals.length ? (vals.reduce(function(a,b){return a+b;},0)/vals.length).toFixed(1) : "–";
      };
      var popupId = "pp_" + spot.place_id;
      var infoHtml =
        '<div id="' + popupId + '" style="' +
          'color:#fff;font-family:system-ui;font-size:13px;' +
          'padding:14px;border-radius:14px;' +
          'background:linear-gradient(135deg,#0f0f1e,#1a1a30);' +
          'box-shadow:0 0 20px rgba(80,100,255,0.55);' +
          'border:1px solid rgba(100,120,255,0.3);' +
          'width:230px;line-height:1.5;">' +
          '<div style="font-weight:700;font-size:15px;margin-bottom:4px;">' + spot.name + '</div>' +
          '<div style="opacity:0.55;font-size:11px;margin-bottom:6px;">' + (spot.vicinity || "") + '</div>' +
          (spot.rating ? '<div>⭐ ' + spot.rating.toFixed(1) + ' Google (' + (spot.user_ratings_total || 0) + ')</div>' : '') +
          '<div style="margin:6px 0;font-size:11px;opacity:0.85;">Community – Smooth: ' + avg("smoothness") + ' · Diff: ' + avg("difficulty") + '</div>' +
          '<a href="https://www.google.com/maps/dir/?api=1&destination=' + loc.lat() + ',' + loc.lng() + '"' +
            ' target="_blank"' +
            ' style="display:block;text-align:center;padding:6px;background:#4a4aff;color:#fff;border-radius:6px;text-decoration:none;font-weight:600;font-size:12px;box-shadow:0 0 8px rgba(74,74,255,0.5);margin-top:8px;">' +
            'Directions →</a>' +
        '</div>';

      var info = new google.maps.InfoWindow({ content: infoHtml });
      var marker = new google.maps.Marker({
        map: map,
        position: loc,
        icon: {
          path: google.maps.SymbolPath.CIRCLE,
          scale: 9,
          fillColor: cfg.color,
          fillOpacity: 1,
          strokeWeight: 1.5,
          strokeColor: "#000",
        },
      });

      (function(spot, info, popupId) {
        marker.addListener("click", function() {
          if (openInfoWindow) openInfoWindow.close();
          info.open(map, marker);
          openInfoWindow = info;
          setTimeout(function() {
            var popup = document.getElementById(popupId);
            if (!popup) return;
            popup.addEventListener("mouseleave", function() {
              if (openInfoWindow === info) { info.close(); openInfoWindow = null; }
            });
          }, 60);
        });
        marker.addListener("dblclick", function() { openDetails(spot); });
      })(spot, info, popupId);

      markers.push(marker);
    });
  }

  // ── Detail panel ───────────────────────────────────────────────────
  function openDetails(spot) {
    activeSpot = spot;
    var panel = document.getElementById("details");
    panel.style.display = "block";
    panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
    document.getElementById("dName").textContent = spot.name;
    document.getElementById("dAddress").textContent = spot.vicinity || spot.formatted_address || "";
    document.getElementById("dRating").textContent = spot.rating
      ? ("⭐ " + spot.rating.toFixed(1) + " Google · " + (spot.user_ratings_total || 0) + " reviews")
      : "No Google rating yet";
    document.getElementById("directionsBtn").onclick = function() {
      var lat = spot.geometry.location.lat();
      var lng = spot.geometry.location.lng();
      window.open("https://www.google.com/maps/dir/?api=1&destination=" + lat + "," + lng);
    };
    renderReviews(spot.place_id);
  }

  // ── Reviews ────────────────────────────────────────────────────────
  function loadReviews(id) {
    return JSON.parse(localStorage.getItem("rc_reviews_" + id) || "[]");
  }
  function saveReviews(id, data) {
    localStorage.setItem("rc_reviews_" + id, JSON.stringify(data));
  }
  function renderReviews(id) {
    var list = document.getElementById("reviewList");
    var reviews = loadReviews(id);
    list.innerHTML = "";
    var avg = function(key) {
      var vals = reviews.map(function(r){return r[key];}).filter(function(v){return v;});
      return vals.length ? (vals.reduce(function(a,b){return a+b;},0)/vals.length).toFixed(1) : "–";
    };
    document.getElementById("avgSmooth").textContent = avg("smoothness");
    document.getElementById("avgDifficulty").textContent = avg("difficulty");
    if (!reviews.length) {
      list.innerHTML = '<div style="opacity:0.4;font-size:0.8rem;">No reviews yet – be the first!</div>';
      return;
    }
    reviews.forEach(function(r) {
      var div = document.createElement("div");
      div.className = "review-item";
      div.innerHTML =
        '<div class="review-meta">' + r.name + '</div>' +
        '<div>' + (r.text || "") + '</div>' +
        '<div class="review-stars">Smooth: ' + (r.smoothness || "–") + ' · Difficulty: ' + (r.difficulty || "–") + '</div>';
      list.appendChild(div);
    });
  }

  // ── User marker ────────────────────────────────────────────────────
  function placeUserMarker(loc) {
    if (!userMarker) {
      userMarker = new google.maps.Marker({
        map: map,
        position: loc,
        icon: {
          path: google.maps.SymbolPath.CIRCLE,
          scale: 10,
          fillColor: "#fff",
          fillOpacity: 1,
          strokeWeight: 3,
          strokeColor: "#4a4aff",
        },
        zIndex: 999,
        title: "You are here",
      });
    } else {
      userMarker.setPosition(loc);
    }
  }

  // ── Bootstrap ──────────────────────────────────────────────────────
  (function bootstrap() {
    fetch("/api/config")
      .then(function(r) { return r.json(); })
      .then(function(d) { return loadMapsScript(d.mapsApiKey || ""); })
      .catch(function() { return loadMapsScript(""); });
  })();
</script>
</body>
</html>
